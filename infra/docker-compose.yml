services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    env_file:
      - ../.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ../microservices/user-service
    container_name: user-service
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kong-net
    volumes:
      - ../microservices/user-service:/app:ro

  payment-service:
    build: ../microservices/payment-service
    container_name: payment-service
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kong-net
    volumes:
      - ../microservices/payment-service:/app

  kong:
    image: kong:latest
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./kong.yml:/kong/kong.yml
    depends_on:
      - user-service
      - payment-service
    networks:
      - kong-net

  admin-ui:
    build: ../admin-ui
    container_name: admin-ui
    environment:
      FLASK_SECRET_KEY: admin-ui-secret-key
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      KONG_ADMIN_URL: http://kong:8001
      USER_SERVICE_URL: http://user-service:5001
      PAYMENT_SERVICE_URL: http://payment-service:5002
      SURICATA_CONFIG_PATH: /shared/suricata.yaml
      SURICATA_EVE_PATH: /shared/eve.json
      KONG_CACHE_TTL: 8
      SURICATA_ALERTS_CACHE_TTL: 8
    ports:
      - "8082:8080"
    volumes:
      - ./suricata/suricata.yaml:/shared/suricata.yaml:ro
      - ./suricata/logs/eve.json:/shared/eve.json:ro
    depends_on:
      kong:
        condition: service_started
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
      suricata:
        condition: service_started
    networks:
      - kong-net

  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    command: ["/bin/bash", "/tmp/start-suricata.sh"]
    environment:
      - SURICATA_RULES_DIR=/var/lib/suricata/rules
    volumes:
      - ./suricata/suricata.yaml:/tmp/suricata.yaml
      - ./suricata/rules/suricata.rules:/tmp/suricata.rules
      - ./suricata/start-suricata.sh:/tmp/start-suricata.sh
      - ./suricata/logs:/var/log/suricata
    network_mode: "service:kong"
    depends_on:
      kong:
        condition: service_started
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "pgrep", "-f", "suricata"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE

  threat-monitor:
    build: ../threat-monitor
    container_name: threat-monitor
    environment:
      KONG_ADMIN_URL: http://kong:8001
    volumes:
      - ./suricata/logs:/var/log/suricata:ro
    networks:
      - kong-net
    depends_on:
      kong:
        condition: service_started
      suricata:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/var/log/suricata/eve.json').is_file() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  suricata-log-pruner:
    build: ../suricata-log-pruner
    container_name: suricata-log-pruner
    environment:
      SURICATA_LOG_DIR: /var/log/suricata
      KEEP_FILES: 20
      INTERVAL_SECONDS: 60
    volumes:
      - ./suricata/logs:/var/log/suricata
    depends_on:
      suricata:
        condition: service_started
    restart: on-failure

volumes:
  postgres-data:

networks:
  kong-net:
    driver: bridge
