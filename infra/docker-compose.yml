version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: api_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ../microservices/user-service
    container_name: user-service
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/api_gateway
      FLASK_ENV: development
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kong-net
    volumes:
      - ../microservices/user-service:/app

  payment-service:
    build: ../microservices/payment-service
    container_name: payment-service
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/api_gateway
      FLASK_ENV: development
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kong-net
    volumes:
      - ../microservices/payment-service:/app

  kong:
    image: kong:latest
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"   # Proxy
      - "8001:8001"   # Admin API
    volumes:
      - ./kong.yml:/kong/kong.yml
    depends_on:
      - user-service
      - payment-service
    networks:
      - kong-net

  mock-service:
    image: nginx
    container_name: mock-service
    ports:
      - "5000:80"
    networks:
      - kong-net

volumes:
  postgres-data:

networks:
  kong-net:
    driver: bridge
