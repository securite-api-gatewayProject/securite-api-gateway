<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure API Gateway - Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-card card border-0 shadow-lg">
      <div class="card-body p-4 p-md-5">
        <div class="brand-pill">Secure API Gateway</div>
        <h1 class="mt-3 mb-2">Admin Dashboard</h1>
        <p class="text-muted mb-4">Accès protégé pour consulter Kong, Suricata et tester l'authentification.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post" class="vstack gap-3">
          <div>
            <label class="form-label">Utilisateur admin</label>
            <input name="username" class="form-control form-control-lg" placeholder="admin" autocomplete="username" required>
          </div>
          <div>
            <label class="form-label">Mot de passe</label>
            <input name="password" type="password" class="form-control form-control-lg" placeholder="admin123" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Se connecter</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
